apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-service
  labels:
    app.kubernetes.io/name: example-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.exampleService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: example-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: example-service
          image: "{{ .Values.exampleService.image.repository }}:{{ .Values.exampleService.image.tag }}"
          imagePullPolicy: {{ .Values.exampleService.image.pullPolicy }}
          env:
            - name: BIND_ADDRESS
              value: "0.0.0.0"
            - name: PORT
              value: "8082"
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.exampleService.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: example-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: example-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8082
      targetPort: http
