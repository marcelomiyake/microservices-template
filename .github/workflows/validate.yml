name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Check Rust, Vue, Helm, and coverage
        run: ./scripts/check-local.sh

  kind-e2e:
    needs: local-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kind
          version: v0.33.0
      - name: Install browser test dependencies
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium
      - name: Deploy to Kind
        run: ./scripts/deploy-kind.sh
      - name: Run browser test through Kubernetes Services
        run: ./scripts/test-kind-e2e.sh
      - name: Remove Helm release
        if: always()
        run: |
          if [[ "$(kubectl config current-context 2>/dev/null)" == "kind-kind" ]] && helm --kube-context kind-kind -n microservices-poc status microservices-poc >/dev/null 2>&1; then
            ./scripts/undeploy-kind.sh
          fi
