sonar.projectKey=microservices-template-example-service
sonar.projectName=Microservices Template Example Service
sonar.sources=services/example-service/src
sonar.tests=services/example-service/tests
sonar.test.inclusions=services/example-service/tests/**/*.rs
sonar.coverage.exclusions=services/example-service/src/main.rs
sonar.rust.cargo.manifestPaths=services/example-service/Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/coverage/example-service-clippy.json
sonar.rust.lcov.reportPaths=target/coverage/example-service.lcov
sonar.exclusions=**/target/**,**/node_modules/**
sonar.sourceEncoding=UTF-8
